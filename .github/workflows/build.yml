name: Tests et APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du moteur de règles
        run: ./gradlew :engine:test

      - name: Construire les APK (tablette et télé)
        run: ./gradlew :app:assembleTabletteDebug :app:assembleTvDebug

      - uses: actions/upload-artifact@v4
        with:
          name: loup-garou-apk
          path: |
            app/build/outputs/apk/tablette/debug/app-tablette-debug.apk
            app/build/outputs/apk/tv/debug/app-tv-debug.apk

      # Sur main, les APK sont aussi publiés en téléchargement direct (sans zip),
      # dans la publication « derniere-version » du dépôt.
      - name: Publier les APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/tablette/debug/app-tablette-debug.apk loup-garou.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk loup-garou-tv.apk
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version loup-garou.apk loup-garou-tv.apk \
            --title "Dernière version" \
            --notes "APK construit depuis le commit ${GITHUB_SHA::7}. Télécharge loup-garou.apk depuis la tablette, ou loup-garou-tv.apk depuis la télé, pour l'installer."
